<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset City Cover Maker — GTA-style poster art from your photos</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>Sunset City Cover Maker</h1>
    <p class="tag">Your photos. Your sunset. One poster that looks like it stole the whole boulevard.</p>

    <fieldset>
      <legend>1 · Your photos</legend>
      <label>Photo 1 <input id="photo1" type="file" accept="image/*"></label>
      <label>Photo 2 <input id="photo2" type="file" accept="image/*"></label>
      <label>Photo 3 <input id="photo3" type="file" accept="image/*"></label>
      <button id="samples" type="button" class="ghost">Try the sample photos first</button>
      <p class="hint">Photos stay on your machine — nothing is ever uploaded.</p>
    </fieldset>

    <fieldset>
      <legend>2 · The poster</legend>
      <div class="row" role="group" aria-label="Poster layout">
        <button type="button" data-layout="strip" class="active">Sunset Strip</button>
        <button type="button" data-layout="split">Triple Split</button>
        <button type="button" data-layout="hero">Big Hero</button>
        <button type="button" data-layout="quad">Four Corners</button>
      </div>
      <label>Post size <select id="size"></select></label>
      <label>Colour grade <select id="grade"></select></label>
      <label class="check"><input id="halftone" type="checkbox" checked> Comic halftone dots</label>
    </fieldset>

    <fieldset>
      <legend>3 · Crop &amp; position</legend>
      <div id="panelBar" class="row" role="group" aria-label="Choose a panel"></div>
      <label>Panel shows
        <select id="panelPhoto">
          <option value="0">Photo 1</option>
          <option value="1">Photo 2</option>
          <option value="2">Photo 3</option>
        </select>
      </label>
      <label>Zoom <span id="zoomVal">1.15×</span>
        <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1.15">
      </label>
      <label>Pan sideways <span id="panXVal">0</span>
        <input id="panX" type="range" min="-100" max="100" step="1" value="0">
      </label>
      <label>Pan up / down <span id="panYVal">0</span>
        <input id="panY" type="range" min="-100" max="100" step="1" value="0">
      </label>
      <p class="hint">Or click a panel in the preview, then drag it to pan.</p>
    </fieldset>

    <fieldset>
      <legend>4 · Say it loud</legend>
      <label>Caption <input id="caption" type="text" maxlength="40" value="Sunset City Called"></label>
      <label>Tagline <input id="tagline" type="text" maxlength="60" value="It wants its neon back"></label>
    </fieldset>

    <button id="export" type="button" class="big">Export PNG — steal the sunset</button>
    <p id="status" role="status"></p>
  </section>
  <canvas id="cover" width="1080" height="1080" aria-label="Live preview of your cover"></canvas>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
